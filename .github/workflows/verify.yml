name: Verify Reports
on:
  push:
    branches: [main, feature/reports-chat-langgraph, fix/typed-semantic-repository-plans]
  pull_request:
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Exercise the same detached checkout used by pull_request builds.
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify SDK reader packaging on a fresh checkout
        shell: pwsh
        run: |
          dotnet build src/LaserficheReports.Web/LaserficheReports.Web.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Web/SDK reader build failed.' }
          $reader = 'src/LaserficheReports.Web/bin/Release/net8.0/recycle-bin'
          foreach ($file in @('LaserficheReports.RecycleBin.exe', 'LaserficheReports.RecycleBin.exe.config', 'Laserfiche.RepositoryAccess.dll', 'Laserfiche-SDK-EULA.md')) {
            $path = Join-Path $reader $file
            if (!(Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Reader payload missing: $file" }
          }
      - run: dotnet test LaserficheReports.sln --configuration Release
      - shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          Get-ChildItem scripts,deployment/windows,tools/reports-graph,build,installer -Filter *.ps1 -Recurse | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Test Git identity for attached and detached checkouts
        shell: pwsh
        run: ./build/Test-SourceInfo.ps1
      - shell: pwsh
        run: ./deployment/windows/build-package.ps1
      - name: Build EXE and MSI from the verified source
        shell: pwsh
        run: ./build/publish.ps1 -Version "1.0.$env:GITHUB_RUN_NUMBER"
      - name: Test native install, repair, rollback, upgrade and removal
        shell: pwsh
        run: ./installer/Test-ReportsInstallation.ps1 -MsiPath "./artifacts/LaserficheReports-1.0.$env:GITHUB_RUN_NUMBER/LaserficheReports.msi"
      - name: Collect Reports runtime diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/acceptance/runtime | Out-Null
          if (Test-Path "$env:ProgramData/LaserficheReports/logs") {
            Copy-Item "$env:ProgramData/LaserficheReports/logs/*" artifacts/acceptance/runtime -Recurse -Force
          }
          Get-Service LaserficheReports -ErrorAction SilentlyContinue | Format-List * | Out-File artifacts/acceptance/service.txt
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
            Where-Object ProviderName -match 'Reports|\.NET Runtime|Application Error' |
            Select-Object -First 20 TimeCreated,ProviderName,Message | Format-List | Out-File artifacts/acceptance/events.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reports-Installer-Acceptance
          path: artifacts/acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: LaserficheReports-Setup
          path: |
            artifacts/LaserficheReports-*/LaserficheReports-Setup.exe
            artifacts/LaserficheReports-*/LaserficheReports.msi
            artifacts/LaserficheReports-*/build-info.json
            artifacts/LaserficheReports-*/SHA256SUMS.txt
            artifacts/LaserficheReports-*/python-dependencies.txt
            artifacts/LaserficheReports-*/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: LaserficheReports-Windows
          path: artifacts/*.zip
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/reports-graph/requirements-test.txt
      - run: python -m compileall -q tools/reports-graph
      - run: python -m unittest discover -s tools/reports-graph -p 'test_*.py'
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/reports-ui
      - run: npm test --prefix tools/reports-ui
  hybrid-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reports_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reports_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/LaserficheReports.Web.Tests --configuration Release --filter FullyQualifiedName~HybridRetrievalDatabaseTests
        env:
          REPORTS_TEST_POSTGRES: Host=localhost;Port=5432;Database=reports_test;Username=postgres;Password=postgres
