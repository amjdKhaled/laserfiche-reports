name: Verify Reports
on:
  push:
    branches: [feature/reports-chat-langgraph, refactor/laserfiche-first-live-data]
  pull_request:
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test LaserficheReports.sln --configuration Release
      - run: dotnet build src/LaserficheReports.Web
      - run: python tools/live-query-smoke.py --dotnet dotnet
      - shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          foreach ($script in @('scripts/configure-database.ps1', 'scripts/start-reports.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - shell: pwsh
        run: ./scripts/test-configure-database.ps1
      - shell: pwsh
        run: ./scripts/test-start-reports.ps1
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/reports-graph/requirements.txt
      - run: python -m compileall -q tools/reports-graph
      - run: python -m unittest discover -s tools/reports-graph -p 'test_*.py'
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/reports-ui
      - run: npm test --prefix tools/reports-ui
  hybrid-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reports_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reports_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test src/LaserficheReports.Web.Tests --configuration Release --filter FullyQualifiedName~HybridRetrievalDatabaseTests
        env:
          REPORTS_TEST_POSTGRES: Host=localhost;Port=5432;Database=reports_test;Username=postgres;Password=postgres
