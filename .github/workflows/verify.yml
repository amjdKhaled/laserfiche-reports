name: Verify Reports
on:
  push:
    branches: [feature/reports-chat-langgraph]
  pull_request:
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test LaserficheReports.sln --configuration Release
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/reports-graph/requirements.txt
      - run: python -m compileall -q tools/reports-graph
      - run: python -m unittest discover -s tools/reports-graph -p 'test_*.py'
