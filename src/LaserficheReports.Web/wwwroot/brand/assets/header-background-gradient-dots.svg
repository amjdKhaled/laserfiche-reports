<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200">
  <!-- خلفية الهيدر v2 (تدرّج + نقط) للإيميلات والـ Word والعروض: نفس isb-header.css -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(10 0.5 0.5)">
      <stop offset="0.55" stop-color="#0B3954"/>
      <stop offset="1" stop-color="#14618A"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.3" fill="#FFFFFF" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="m">
      <rect x="720" width="880" height="196" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1600" height="200" fill="url(#bg)"/>
  <rect x="720" width="880" height="196" fill="url(#dots)" mask="url(#m)"/>
  <rect y="196" width="1600" height="4" fill="#C29A2E"/>
</svg>
